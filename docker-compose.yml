version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: perimeter-postgis
    restart: always
    environment:
      POSTGRES_DB: perimeter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d perimeter"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
